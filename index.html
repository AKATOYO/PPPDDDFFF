<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Extractor de Información del PDF</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  #pdf-upload { margin-bottom: 10px; }
  #procesar { padding: 8px 16px; margin-bottom: 20px; }
  #resultado { margin-top: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  th { background-color: #f4f4f4; }
  #loading { margin-top: 10px; }
</style>
</head>
<body>

<h1>Extractor de Información del PDF</h1>
<input type="file" id="pdf-upload" accept="application/pdf" />
<button id="procesar">Procesar PDF</button>
<div id="loading"></div>
<div id="resultado"></div>

<!-- Incluye las librerías -->
<script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2/dist/tesseract.min.js"></script>
<script>
  const pdfjsLib = window['pdfjs-dist/build/pdf'];
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://mozilla.github.io/pdf.js/build/pdf.worker.js';

document.getElementById('procesar').addEventListener('click', () => {
  const fileInput = document.getElementById('pdf-upload');
  const file = fileInput.files[0];
  const loadingDiv = document.getElementById('loading');
  const resultadoDiv = document.getElementById('resultado');

  resultadoDiv.innerHTML = '';
  if (!file || file.type !== 'application/pdf') {
    alert('Por favor, carga un archivo PDF válido.');
    return;
  }

  loadingDiv.innerHTML = 'Procesando PDF, por favor espera...';

  const reader = new FileReader();
  reader.onload = function(e) {
    const typedarray = new Uint8Array(e.target.result);
    processPDF(typedarray);
  };
  reader.readAsArrayBuffer(file);
});

async function processPDF(data) {
  const loadingDiv = document.getElementById('loading');
  const resultadoDiv = document.getElementById('resultado');

  const pdf = await pdfjsLib.getDocument({ data }).promise;
  const numPages = pdf.numPages;
  const resultados = [];

  for (let pageNum = 1; pageNum <= numPages; pageNum++) {
    const page = await pdf.getPage(pageNum);
    // Renderizar página en canvas
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: context, viewport: viewport }).promise;

    // Convertir canvas a imagen
    const dataURL = canvas.toDataURL('image/png');

    // Realizar OCR
    const texto = await recognizeText(dataURL);

    resultados.push({ pagina: pageNum, texto: texto });
  }

  mostrarResultados(resultados);
  document.getElementById('loading').innerHTML = '';
}

async function recognizeText(imageDataUrl) {
  const result = await Tesseract.recognize(
    imageDataUrl,
    'spa',
    {
      logger: m => {
        // Puedes agregar un log opcional
        //console.log(m);
      }
    }
  );
  return result.data.text;
}

function mostrarResultados(datos) {
  const container = document.getElementById('resultado');
  container.innerHTML = '';

  if (datos.length === 0) {
    container.innerHTML = '<p>No se encontraron páginas o no se pudo extraer texto.</p>';
    return;
  }

  // Crear tabla
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trHead = document.createElement('tr');
  ['Página', 'Texto Extraído'].forEach(texto => {
    const th = document.createElement('th');
    th.textContent = texto;
    trHead.appendChild(th);
  });
  thead.appendChild(trHead);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  datos.forEach(dato => {
    const tr = document.createElement('tr');
    const tdPage = document.createElement('td');
    tdPage.textContent = dato.pagina;
    const tdTexto = document.createElement('td');
    // Limitar la longitud del texto para mejor visualización
    const textoCorto = dato.texto.length > 200 ? dato.texto.substring(0, 200) + '...' : dato.texto;
    tdTexto.textContent = textoCorto;
    tr.appendChild(tdPage);
    tr.appendChild(tdTexto);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  container.appendChild(table);
}
</script>

</body>
</html>
